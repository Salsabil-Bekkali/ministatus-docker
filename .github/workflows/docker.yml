name: Docker CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  IMAGE: ministatus

jobs:
  build-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint du Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Build de l'image
        run: docker build --build-arg APP_VERSION=ci -t ${{ env.IMAGE }}:ci .

      - name: Tests dans le conteneur
        run: docker run --rm ${{ env.IMAGE }}:ci python -m unittest -v

      - name: Rapport Trivy (JSON)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE }}:ci
          format: json
          output: trivy-report.json
          exit-code: "0"

      - name: Rapport Trivy (HTML)
        if: always()
        run: |
          python3 - <<'EOF'
          import json, html
          with open("trivy-report.json") as f:
              data = json.load(f)
          rows = ""
          for r in data.get("Results", []):
              for v in r.get("Vulnerabilities") or []:
                  cells = (v.get("PkgName"), v.get("VulnerabilityID"), v.get("Severity"),
                           v.get("InstalledVersion"), v.get("FixedVersion", ""))
                  rows += "<tr>" + "".join("<td>" + html.escape(str(x)) + "</td>" for x in cells) + "</tr>\n"
          page = ("<html><head><meta charset='utf-8'><title>Rapport Trivy</title>"
                  "<style>body{font-family:sans-serif}table{border-collapse:collapse}"
                  "td,th{border:1px solid #999;padding:4px 8px}</style></head><body>"
                  "<h1>Rapport Trivy</h1><table><tr><th>Paquet</th><th>CVE</th>"
                  "<th>Gravite</th><th>Version installee</th><th>Version corrigee</th></tr>"
                  + rows + "</table></body></html>")
          with open("trivy-report.html", "w") as f:
              f.write(page)
          EOF

      - name: Resume dans la page du run
        if: always()
        run: |
          echo "### Rapport Trivy" >> "$GITHUB_STEP_SUMMARY"
          for s in CRITICAL HIGH MEDIUM; do
            n=$(jq "[.Results[]?.Vulnerabilities[]? | select(.Severity==\"$s\")] | length" trivy-report.json)
            echo "- $s : $n" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Publier les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: trivy-report.*

      - name: Quality gate (HIGH et CRITICAL)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE }}:ci
          format: table
          severity: HIGH,CRITICAL
          vuln-type: library
          ignore-unfixed: true
          exit-code: "1"